model: router
experiment_name: router_v1_mobilenet_v3_small

data:
  image_size: 224
  batch_size: 16
  num_workers: 0
  equal_domain_sampling: true

training:
  seed: 42
  device: auto
  amp: true
  phase1_epochs: 3
  phase2_epochs: 5
  phase1_lr: 0.001
  phase2_lr: 0.0001
  unfreeze_blocks: 2
  weight_decay: 0.0001
  early_stopping:
    enabled: true
    patience: 2
    min_delta: 0.0005

checkpoint:
  filename: router_v1_mobilenet_v3_small.pt
